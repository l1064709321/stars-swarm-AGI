[package]
name = "star-os-core"
version = "0.0.1"
edition = "2021"
description = "Star A.I. OS v0.0.0.1 - Rust core modules (SNN, Kalman Filter, Tarpit)"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
ndarray = { version = "0.15", features = ["serde"] }
rand = "0.8"
bincode = "1.3"
tokio = { version = "1.0", features = ["full"] }

[lib]
name = "star_core"
path = "src/core/mod.rs"

[[bin]]
name = "tarpit"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
